# Static SPA server for the 360 Feedback frontend.
# This file is copied to /etc/nginx/templates/default.conf.template; the
# nginx image's entrypoint runs envsubst on it, so ${PORT} is resolved from
# the environment (Cloud Run injects 8080).
# - try_files falls back to index.html so client-side routes resolve on
#   hard navigation (every route renders client-side; ssr=false).
# - Hashed assets under /_app are immutable; index.html must never be cached.

server {
    listen ${PORT};

    root /usr/share/nginx/html;
    index index.html;

    # Compress text payloads (JS bundles are the bulk of the initial load).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Hashed, immutable build assets.
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell must always be revalidated, never cached by intermediaries.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # All other paths fall back to the shell for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}