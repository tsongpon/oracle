name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Auto-cancel superseded PR runs; never cancel in-flight main deploys.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with docs/gcp-setup-frontend.md.
  # Image ref format: {REGION}-docker.pkg.dev/{PROJECT}/{ARTIFACT_REPO}/{IMAGE_NAME}:{TAG}
  GCP_REGION: asia-southeast1
  ARTIFACT_REPO: oracle
  IMAGE_NAME: oracle
  CLOUD_RUN_SERVICE: oracle
  # Baked into the static bundle at build time; empty -> same-origin /v1.
  VITE_API_BASE_URL: https://echo-443460999135.asia-southeast1.run.app

permissions:
  # Required for keyless Workload Identity Federation auth.
  id-token: write
  # Required to fetch the commit SHA in deploy steps.
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Type check: run on every push (main + PRs) and on PRs.
  # ---------------------------------------------------------------
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: svelte-check
        run: npm run check

  # ---------------------------------------------------------------
  # 2. Build & push container image to Artifact Registry.
  #    Only runs on main after checks pass (skipped on PRs).
  # ---------------------------------------------------------------
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          # Impersonate the deployer SA: the raw federated identity has no IAM
          # roles, so pushes/deploys must act as this service account.
          service_account: ${{ secrets.GCP_DEPLOYER_SA_EMAIL }}
          # Required to populate the access_token output used by Docker login.
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Extract image tag
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx (docker-container driver for registry cache)
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:main
          # Registry cache backend: stores BuildKit cache as a separate image
          # ref in Artifact Registry. More reliable than the gha backend and
          # has no GitHub cache size limits.
          cache-from: type=registry,ref=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ---------------------------------------------------------------
  # 3. Deploy to production on Cloud Run. Depends on the image push.
  #    Uses the GitHub "production" environment so protection rules
  #    (required reviewers) can be enabled in repo settings.
  # ---------------------------------------------------------------
  deploy-production:
    name: Deploy to production (Cloud Run)
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          # Impersonate the deployer SA: the raw federated identity has no IAM
          # roles, so pushes/deploys must act as this service account.
          service_account: ${{ secrets.GCP_DEPLOYER_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Extract image tag
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}
          # Public static site: no runtime service account is needed (the
          # container only serves files; it touches no Google APIs).
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=256Mi

      - name: Verify public access
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${URL}/")
          echo "GET ${URL}/ -> HTTP ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "::error::Public site check failed (expected 200, got ${STATUS}). Check the invoker binding or auth config."
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "## Cloud Run deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Service: \`${{ env.CLOUD_RUN_SERVICE }}\` in \`${{ env.GCP_REGION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`${{ steps.meta.outputs.sha_short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"